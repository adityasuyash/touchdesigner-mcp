[pytest]
testpaths = tests
# `ffmpeg` marks tests that shell out to ffmpeg; `td` marks the ones that need a
# running TouchDesigner. Both are skipped automatically when the tool is absent,
# so the default run is pure Python and needs nothing installed but pytest.
markers =
    ffmpeg: needs ffmpeg and ffprobe on PATH
    td: needs TouchDesigner answering on :9988
filterwarnings =
    error::DeprecationWarning
